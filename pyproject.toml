[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traceatlas"
version = "0.1.0"
description = "Local, traceable analysis workspace for Windows"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "PySide6==6.11.2",
  "duckdb==1.5.6",
  "pyarrow==26.0.0",
  "openpyxl==3.1.5",
  "psutil>=7,<9",
]

[project.gui-scripts]
traceatlas = "traceatlas.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.5,<5", "pyinstaller==6.22.3", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/traceatlas"]
